server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. Scripts may only come from this origin (no inline, no
    # CDNs); API calls, photos and Supabase are reached over https/wss.
    # 'wasm-unsafe-eval' lets the video exporter compile its WebAssembly AAC
    # encoder (a fallback where the browser cannot encode AAC itself).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: data: https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # SPA fallback — all routes handled by React. index.html must revalidate
    # so a deploy is picked up; `expires` (not add_header) keeps the security
    # headers above inherited in these blocks.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never serve dotfiles or source maps
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
