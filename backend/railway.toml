[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Frontend-only commits shouldn't rebuild the (slow) ML image.
watchPatterns = ["/backend/**"]

[deploy]
healthcheckPath = "/api/health"
# Models are baked into the image, but loading them all on CPU still takes a while.
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# In-memory job progress + SQLite: exactly one instance.
numReplicas = 1
