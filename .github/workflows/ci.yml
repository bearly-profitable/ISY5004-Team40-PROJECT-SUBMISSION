name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately light: the pure-math modules (curation, corrections,
      # store) need only numpy. The API integration tests import torch /
      # mediapipe and skip themselves automatically when those are absent —
      # run them locally with the full environment.
      - name: Install test dependencies
        run: pip install numpy pytest
      - name: Run unit tests
        run: pytest backend/tests -q

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
