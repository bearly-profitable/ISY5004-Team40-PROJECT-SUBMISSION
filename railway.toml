# Single service: the root Dockerfile builds the web app and serves it from
# the backend. See README "Deploying to Railway".
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
# Model weights download on first boot (~2.5 GB), then load on CPU: allow up to 10 minutes.
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# In-memory job progress + SQLite: exactly one instance.
numReplicas = 1
